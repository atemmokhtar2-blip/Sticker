kind = "web"
previewPath = "/"
title = "WhatsApp Sticker Bot Dashboard"
version = "1.0.0"
id = "artifacts/sticker-bot-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21674

[services.development]
run = "pnpm --filter @workspace/sticker-bot-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sticker-bot-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/sticker-bot-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21674"
BASE_PATH = "/"
